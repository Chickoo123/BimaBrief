name: Data correction request
description: Report a reproducible issue in a metric or source attribution
title: "Data correction: [metric / table / year]"
body:
  - type: markdown
    attributes:
      value: |
        Please report verifiable data or calculation issues only. Do not include policy documents, claim references, contact details, medical data or allegations about an individual/company. Use neutral, source-linked wording.
  - type: input
    id: metric
    attributes:
      label: Metric or chart
      description: Name the metric shown on BimaBrief.
      placeholder: e.g. health ICR, claims aging, state premium
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source, table and reporting year
      description: Link to the original public source and name the table/year.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What looks incorrect?
      description: Explain the discrepancy and, where possible, provide a reproducible calculation.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and neutrality check
      options:
        - label: I have not included personal, medical, claim or confidential information.
          required: true
        - label: This report concerns a source, label or calculation—not an unsupported allegation.
          required: true
